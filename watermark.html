<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Tool — Farhan's Photography</title>
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --gold:#c9a96e; --gold-light:#e2c99a;
    --dark:#0a0a0a; --dark-2:#111111; --dark-3:#1a1a1a; --dark-4:#242424;
    --text:#f0ece4; --muted:#8a8070; --error:#d97a6e; --ok:#8fbf8a;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Barlow', sans-serif;
  }

  body{
    background:var(--dark); color:var(--text); font-family:var(--sans);
    font-weight:300; line-height:1.6; min-height:100vh;
  }

  nav{
    padding:1.3rem 2.5rem; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid rgba(201,169,110,0.12);
  }
  .nav-logo{
    font-family:var(--serif); font-size:1.3rem; font-weight:300; color:var(--gold);
    letter-spacing:0.06em; text-decoration:none;
  }
  .nav-back{
    font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--muted); text-decoration:none; transition:color .3s;
  }
  .nav-back:hover{ color:var(--gold); }

  main{
    max-width:1200px; margin:0 auto; padding:2.5rem 2rem 5rem;
    display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,380px);
    gap:2rem; align-items:start;
  }
  @media (max-width:880px){ main{ grid-template-columns:1fr; padding:1.5rem 1.2rem 4rem; } }

  h1{ font-family:var(--serif); font-weight:300; font-size:1.8rem; margin-bottom:0.3rem; }
  .sub{ font-size:0.85rem; color:var(--muted); margin-bottom:1.5rem; }

  /* preview area */
  .stage{
    background:var(--dark-2); border:1px solid rgba(201,169,110,0.12);
    padding:1.5rem; display:flex; flex-direction:column; align-items:center;
    min-height:420px; justify-content:center; position:relative;
  }
  .drop-zone{
    width:100%; min-height:380px; border:1.5px dashed rgba(201,169,110,0.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; transition:all .25s; text-align:center; padding:2rem;
  }
  .drop-zone.drag-over, .drop-zone:hover{ border-color:var(--gold); background:rgba(201,169,110,0.04); }
  .drop-zone .dz-icon{ font-size:2rem; margin-bottom:0.6rem; color:var(--gold); }
  .drop-zone p{ font-size:0.9rem; color:var(--muted); }
  .drop-zone input[type=file]{ display:none; }

  canvas{ max-width:100%; display:block; touch-action:none; cursor:grab; }
  canvas.dragging{ cursor:grabbing; }

  .stage-actions{
    display:flex; gap:0.6rem; margin-top:1rem; width:100%; flex-wrap:wrap;
  }

  /* controls panel */
  .panel{
    background:var(--dark-2); border:1px solid rgba(201,169,110,0.12);
    padding:1.6rem; position:sticky; top:1.5rem;
  }
  .panel h2{
    font-family:var(--serif); font-size:1.15rem; font-weight:400;
    margin-bottom:1.1rem; padding-bottom:0.7rem; border-bottom:1px solid rgba(201,169,110,0.15);
  }
  .fr{ margin-bottom:1.1rem; }
  .fr label{
    display:flex; justify-content:space-between; font-size:0.72rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:0.5rem;
  }
  .fr label span.val{ color:var(--gold-light); letter-spacing:0; text-transform:none; }

  .fi{
    width:100%; padding:0.65rem 0.8rem; background:var(--dark-3);
    border:1px solid rgba(201,169,110,0.15); color:var(--text);
    font-family:var(--sans); font-size:0.88rem; outline:none; transition:border-color .2s;
  }
  .fi:focus{ border-color:var(--gold); }

  input[type=range]{
    width:100%; accent-color:var(--gold); background:transparent;
  }

  .mode-toggle{ display:flex; gap:0; margin-bottom:1.2rem; border:1px solid rgba(201,169,110,0.2); }
  .mode-toggle button{
    flex:1; padding:0.6rem; background:transparent; border:none; color:var(--muted);
    font-family:var(--sans); font-size:0.78rem; letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer; transition:all .2s;
  }
  .mode-toggle button.active{ background:var(--gold); color:var(--dark); font-weight:500; }

  .pos-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:1.1rem;
  }
  .pos-grid button{
    aspect-ratio:1; background:var(--dark-3); border:1px solid rgba(201,169,110,0.15);
    cursor:pointer; position:relative; transition:all .2s;
  }
  .pos-grid button::after{
    content:''; position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--muted);
  }
  .pos-grid button[data-p="tl"]::after{ top:6px; left:6px; }
  .pos-grid button[data-p="tc"]::after{ top:6px; left:50%; transform:translateX(-50%); }
  .pos-grid button[data-p="tr"]::after{ top:6px; right:6px; }
  .pos-grid button[data-p="cl"]::after{ top:50%; left:6px; transform:translateY(-50%); }
  .pos-grid button[data-p="cc"]::after{ top:50%; left:50%; transform:translate(-50%,-50%); }
  .pos-grid button[data-p="cr"]::after{ top:50%; right:6px; transform:translateY(-50%); }
  .pos-grid button[data-p="bl"]::after{ bottom:6px; left:6px; }
  .pos-grid button[data-p="bc"]::after{ bottom:6px; left:50%; transform:translateX(-50%); }
  .pos-grid button[data-p="br"]::after{ bottom:6px; right:6px; }
  .pos-grid button:hover{ border-color:var(--gold); }
  .pos-grid button.active{ border-color:var(--gold); background:rgba(201,169,110,0.08); }
  .pos-grid button.active::after{ background:var(--gold); }

  .chk-row{ display:flex; align-items:center; gap:0.6rem; margin-bottom:1.1rem; }
  .chk-row input{ accent-color:var(--gold); width:16px; height:16px; }
  .chk-row label{ font-size:0.8rem; color:var(--text); text-transform:none; letter-spacing:0; }

  .btn-primary{
    width:100%; padding:0.85rem; background:var(--gold); color:var(--dark);
    font-family:var(--sans); font-size:0.78rem; font-weight:500; letter-spacing:0.14em;
    text-transform:uppercase; border:none; cursor:pointer; transition:background .3s, transform .2s;
  }
  .btn-primary:hover:not(:disabled){ background:var(--gold-light); transform:translateY(-1px); }
  .btn-primary:disabled{ opacity:0.4; cursor:default; }

  .btn-secondary{
    width:100%; padding:0.8rem; background:transparent; color:var(--muted);
    font-family:var(--sans); font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase;
    border:1px solid rgba(201,169,110,0.2); cursor:pointer; transition:all .2s;
  }
  .btn-secondary:hover{ border-color:var(--gold); color:var(--gold); }

  .toast{
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--dark-3); border:1px solid rgba(201,169,110,0.25); padding:0.8rem 1.3rem;
    font-size:0.82rem; opacity:0; pointer-events:none; transition:all .25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.ok{ color:var(--ok); border-color:rgba(143,191,138,0.3); }
  .toast.err{ color:var(--error); border-color:rgba(217,122,110,0.3); }

  .hint{ font-size:0.72rem; color:var(--muted); margin-top:0.4rem; line-height:1.5; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Farhan's Photography</a>
  <a href="index.html" class="nav-back">← Back to Site</a>
</nav>

<main>
  <div>
    <h1>Watermark Tool</h1>
    <p class="sub">Add a text or logo watermark to your photos, right in the browser — nothing uploads anywhere.</p>

    <div class="stage">
      <div class="drop-zone" id="dropZone">
        <div class="dz-icon">📷</div>
        <p>Click or drag a photo here</p>
        <p class="hint">JPG, PNG, or WebP</p>
        <input type="file" id="fileInput" accept="image/*">
      </div>
      <canvas id="cv" style="display:none;"></canvas>
      <div class="stage-actions" id="stageActions" style="display:none;">
        <button class="btn-secondary" id="changeImg" style="flex:1;">Change Photo</button>
        <button class="btn-primary" id="downloadBtn" style="flex:1;">Download Watermarked</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Watermark</h2>

    <div class="mode-toggle">
      <button id="modeLogo" class="active">Logo Image</button>
      <button id="modeText">Text</button>
    </div>

    <div id="logoControls">
      <div class="fr">
        <label>Watermark Logo <span class="val" id="logoSourceTag"></span></label>
        <div id="logoPreviewWrap" style="margin-bottom:0.6rem;">
          <img id="logoPreview" style="max-width:100%; max-height:70px; display:block; background:repeating-conic-gradient(#2a2a2a 0% 25%, #1a1a1a 0% 50%) 50% / 14px 14px;">
        </div>
        <input type="file" class="fi" id="logoInput" accept="image/*">
        <p class="hint" id="logoHint">Loading watermark.png from the server…</p>
      </div>
    </div>

    <div id="textControls" style="display:none;">
      <div class="fr">
        <label>Watermark Text</label>
        <input type="text" class="fi" id="wmText" value="Farhan's Photography" maxlength="60">
      </div>
      <div class="fr">
        <label>Text Color</label>
        <input type="color" class="fi" id="wmColor" value="#f0ece4" style="height:40px; cursor:pointer;">
      </div>
    </div>

    <div class="fr">
      <label>Size <span class="val" id="sizeVal">6%</span></label>
      <input type="range" id="wmSize" min="2" max="30" value="6">
    </div>

    <div class="fr">
      <label>Opacity <span class="val" id="opVal">55%</span></label>
      <input type="range" id="wmOpacity" min="5" max="100" value="55">
    </div>

    <div class="fr">
      <label>Rotation <span class="val" id="rotVal">0°</span></label>
      <input type="range" id="wmRotation" min="-45" max="45" value="0">
    </div>

    <div class="chk-row">
      <input type="checkbox" id="wmTile">
      <label for="wmTile">Tile across whole photo</label>
    </div>

    <div class="fr" id="positionBlock">
      <label>Position</label>
      <div class="pos-grid">
        <button data-p="tl"></button><button data-p="tc"></button><button data-p="tr"></button>
        <button data-p="cl"></button><button data-p="cc"></button><button data-p="cr"></button>
        <button data-p="bl"></button><button data-p="bc" class="active"></button><button data-p="br"></button>
      </div>
      <p class="hint">Or drag the watermark directly on the photo.</p>
    </div>

    <div class="fr">
      <label>Margin <span class="val" id="marginVal">4%</span></label>
      <input type="range" id="wmMargin" min="0" max="15" value="4">
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const dropZone = $('#dropZone'), fileInput = $('#fileInput'), cv = $('#cv'), ctx = cv.getContext('2d');
  const stageActions = $('#stageActions'), changeImgBtn = $('#changeImg'), downloadBtn = $('#downloadBtn');

  // Path to the standing watermark file on the server. Change this if you move the file.
  const DEFAULT_LOGO_PATH = 'images/watermark.png';

  let img = null, logoImg = null;
  let W = 0, H = 0;

  function loadDefaultLogo() {
    const probe = new Image();
    probe.onload = () => {
      logoImg = probe;
      $('#logoPreview').src = DEFAULT_LOGO_PATH;
      $('#logoSourceTag').textContent = '(from server)';
      $('#logoHint').textContent = 'Using ' + DEFAULT_LOGO_PATH + '. Upload a file below to use a different one instead.';
      draw();
    };
    probe.onerror = () => {
      $('#logoSourceTag').textContent = '';
      $('#logoHint').textContent = 'Could not find ' + DEFAULT_LOGO_PATH + ' on the server — upload a watermark PNG below.';
    };
    probe.src = DEFAULT_LOGO_PATH;
  }
  loadDefaultLogo();

  const st = {
    mode: 'logo',
    text: $('#wmText').value,
    color: $('#wmColor').value,
    size: 6,
    opacity: 55,
    rotation: 0,
    tile: false,
    pos: 'bc',
    margin: 4,
    // manual drag offset (fraction of W/H), null until user drags
    dragX: null,
    dragY: null
  };

  function toast(type, msg, ms = 2800) {
    const t = $('#toast');
    t.className = 'toast show ' + type;
    t.textContent = msg;
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ---------- load image ----------
  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) { toast('err', 'Please choose an image file.'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const image = new Image();
      image.onload = () => {
        img = image;
        W = img.naturalWidth; H = img.naturalHeight;
        cv.width = W; cv.height = H;
        cv.style.display = 'block';
        dropZone.style.display = 'none';
        stageActions.style.display = 'flex';
        st.dragX = null; st.dragY = null;
        draw();
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
  ['dragover', 'dragenter'].forEach(ev => dropZone.addEventListener(ev, e => {
    e.preventDefault(); dropZone.classList.add('drag-over');
  }));
  ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
  }));
  dropZone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
  changeImgBtn.addEventListener('click', () => {
    img = null;
    cv.style.display = 'none';
    dropZone.style.display = 'flex';
    stageActions.style.display = 'none';
    fileInput.value = '';
  });

  // ---------- logo ----------
  $('#logoInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const image = new Image();
      image.onload = () => {
        logoImg = image;
        $('#logoPreview').src = ev.target.result;
        $('#logoSourceTag').textContent = '(uploaded)';
        $('#logoHint').textContent = 'Using the file you just uploaded. Reload the page to go back to the server default.';
        draw();
      };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ---------- mode toggle ----------
  $('#modeText').addEventListener('click', () => setMode('text'));
  $('#modeLogo').addEventListener('click', () => setMode('logo'));
  function setMode(m) {
    st.mode = m;
    $('#modeText').classList.toggle('active', m === 'text');
    $('#modeLogo').classList.toggle('active', m === 'logo');
    $('#textControls').style.display = m === 'text' ? 'block' : 'none';
    $('#logoControls').style.display = m === 'logo' ? 'block' : 'none';
    draw();
  }

  // ---------- controls ----------
  $('#wmText').addEventListener('input', e => { st.text = e.target.value; draw(); });
  $('#wmColor').addEventListener('input', e => { st.color = e.target.value; draw(); });
  $('#wmSize').addEventListener('input', e => { st.size = +e.target.value; $('#sizeVal').textContent = st.size + '%'; draw(); });
  $('#wmOpacity').addEventListener('input', e => { st.opacity = +e.target.value; $('#opVal').textContent = st.opacity + '%'; draw(); });
  $('#wmRotation').addEventListener('input', e => { st.rotation = +e.target.value; $('#rotVal').textContent = st.rotation + '°'; draw(); });
  $('#wmMargin').addEventListener('input', e => { st.margin = +e.target.value; $('#marginVal').textContent = st.margin + '%'; draw(); });
  $('#wmTile').addEventListener('change', e => {
    st.tile = e.target.checked;
    $('#positionBlock').style.opacity = st.tile ? 0.4 : 1;
    $('#positionBlock').style.pointerEvents = st.tile ? 'none' : 'auto';
    draw();
  });

  document.querySelectorAll('.pos-grid button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pos-grid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      st.pos = btn.dataset.p;
      st.dragX = null; st.dragY = null;
      draw();
    });
  });

  // ---------- position resolution ----------
  function basePosition(wmW, wmH) {
    const mX = W * st.margin / 100, mY = H * st.margin / 100;
    let x, y;
    if (st.pos.includes('l')) x = mX;
    else if (st.pos.includes('r')) x = W - wmW - mX;
    else x = (W - wmW) / 2;
    if (st.pos[0] === 't') y = mY;
    else if (st.pos[0] === 'b') y = H - wmH - mY;
    else y = (H - wmH) / 2;
    return { x, y };
  }

  // ---------- drawing ----------
  function measureWatermark() {
    if (st.mode === 'text') {
      const fontPx = Math.max(10, W * st.size / 100);
      ctx.font = `600 ${fontPx}px Barlow, sans-serif`;
      const metrics = ctx.measureText(st.text || ' ');
      return { w: metrics.width, h: fontPx, fontPx };
    } else {
      const wmW = W * st.size / 100;
      const ratio = logoImg ? logoImg.naturalHeight / logoImg.naturalWidth : 1;
      return { w: wmW, h: wmW * ratio };
    }
  }

  function drawWatermarkAt(x, y, dims) {
    ctx.save();
    ctx.globalAlpha = st.opacity / 100;
    const cx = x + dims.w / 2, cy = y + dims.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate(st.rotation * Math.PI / 180);
    if (st.mode === 'text') {
      ctx.fillStyle = st.color;
      ctx.font = `600 ${dims.fontPx}px Barlow, sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = dims.fontPx * 0.08;
      ctx.fillText(st.text, 0, 0);
    } else if (logoImg) {
      ctx.drawImage(logoImg, -dims.w / 2, -dims.h / 2, dims.w, dims.h);
    }
    ctx.restore();
  }

  function draw() {
    if (!img) return;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    if (st.mode === 'logo' && !logoImg) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f0ece4';
      ctx.font = `${Math.max(14, W * 0.025)}px Barlow, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Upload your watermark PNG on the right →', W / 2, H / 2);
      ctx.restore();
      return;
    }
    if (st.mode === 'text' && !st.text.trim()) { return; }

    const dims = measureWatermark();

    if (st.tile) {
      const stepX = dims.w * 2.2, stepY = dims.h * 3.5;
      for (let y = -stepY; y < H + stepY; y += stepY) {
        for (let x = -stepX; x < W + stepX; x += stepX) {
          drawWatermarkAt(x, y, dims);
        }
      }
      return;
    }

    let pos;
    if (st.dragX !== null) {
      pos = { x: st.dragX - dims.w / 2, y: st.dragY - dims.h / 2 };
    } else {
      pos = basePosition(dims.w, dims.h);
    }
    drawWatermarkAt(pos.x, pos.y, dims);
  }

  // ---------- drag to reposition (single watermark only) ----------
  let dragging = false;
  function toCanvasCoords(e) {
    const rect = cv.getBoundingClientRect();
    const k = W / rect.width;
    return { x: (e.clientX - rect.left) * k, y: (e.clientY - rect.top) * k };
  }
  cv.addEventListener('pointerdown', e => {
    if (!img || st.tile) return;
    dragging = true;
    cv.classList.add('dragging');
    cv.setPointerCapture(e.pointerId);
    const p = toCanvasCoords(e);
    st.dragX = p.x; st.dragY = p.y;
    draw();
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = toCanvasCoords(e);
    st.dragX = p.x; st.dragY = p.y;
    draw();
  });
  const endDrag = () => { dragging = false; cv.classList.remove('dragging'); };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---------- download ----------
  downloadBtn.addEventListener('click', () => {
    if (!img) return;
    cv.toBlob(blob => {
      if (!blob) { toast('err', 'Could not create the image.'); return; }
      const a = document.createElement('a');
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      a.href = URL.createObjectURL(blob);
      a.download = `watermarked-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('ok', 'Downloaded.');
    }, 'image/png');
  });
})();
</script>
</body>
</html>
